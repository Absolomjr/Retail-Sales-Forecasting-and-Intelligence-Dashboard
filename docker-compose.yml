# Full stack: dashboard -> API -> model, with MLflow and Postgres alongside.
#
#   docker compose up --build
#
#   dashboard  http://localhost:3000
#   API docs   http://localhost:8000/docs
#   MLflow     http://localhost:5000
#
# The API needs `artifacts/`, which Part 6 of retail_forecasting.ipynb writes.
# It is mounted read-only: containers serve the model, they never retrain it.

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RSF_ARTIFACTS_DIR: /srv/artifacts
      # Analytics tables are read from Postgres when seeded, else from parquet.
      RSF_DATABASE_URL: postgresql+psycopg://retail:retail@database:5432/retail
      RSF_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    volumes:
      - ./artifacts:/srv/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  mlflow:
    image: python:3.12-slim
    working_dir: /mlflow
    # The notebook writes runs to ./mlflow.db; this serves that same database.
    command: >
      sh -c "pip install --no-cache-dir 'mlflow>=3,<4' &&
             mlflow server
               --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/mlartifacts"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts
    ports:
      - "5000:5000"

  # One-shot: copy the analytics parquet tables into Postgres, then exit.
  # `docker compose run --rm seed`
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["tools"]
    environment:
      RSF_ARTIFACTS_DIR: /srv/artifacts
      RSF_DATABASE_URL: postgresql+psycopg://retail:retail@database:5432/retail
    volumes:
      - ./artifacts:/srv/artifacts:ro
      - ./scripts:/srv/scripts:ro
    command: ["python", "/srv/scripts/seed_postgres.py"]
    depends_on:
      database:
        condition: service_healthy

volumes:
  pgdata:
